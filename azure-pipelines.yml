# Node.js React Web App to Linux on Azure
# Build a Node.js React app and deploy it to Azure as a Linux web app.

trigger:
- staging

variables:
  azureSubscription: '802e3b54-e862-400f-99da-3d80e72f07c2'
  webAppName: 'myportfolio-staging'
  environmentName: 'myportfolio-staging'
  vmImageName: 'ubuntu-latest'
  nodeVersion: '~22'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: 'Install Node.js 22.x'

    # Crear .env.staging para el cliente
    - script: |
        cd client
        echo "VITE_API_BASE_URL=/api" > .env.staging
      displayName: 'Ensure .env.staging exists for client'

    # Build frontend React
    - script: |
        cd client
        npm ci
        npm run build:staging
      displayName: 'Build React frontend for staging'

    # Preparar servidor y copiar build de React
    - script: |
        cd server
        npm ci --production
        mkdir -p public
        cp -r ../client/dist/* public/
      displayName: 'Setup server and copy frontend build'

    # Crear .env.staging para servidor
    - script: |
        cd server
        if [ ! -f .env.staging ]; then
          echo "# Environment variables for staging" > .env.staging
          echo "PORT=8080" >> .env.staging
          echo "NODE_ENV=staging" >> .env.staging
        fi
      displayName: 'Ensure .env.staging exists'

    # Comprimir para despliegue
    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/server'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      artifact: drop

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: $(environmentName)
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureRmWebAppDeployment@4
            displayName: 'Azure App Service Deploy: myportfolio-staging'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              WebAppName: $(webAppName)
              packageForLinux: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              RuntimeStack: 'NODE|22'
              StartupCommand: 'chmod +x .config/azure/startup.sh && .config/azure/startup.sh'
              AppSettings: '-WEBSITE_NODE_DEFAULT_VERSION ~22'